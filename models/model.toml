# Вход и выход у обоих вариантов одинаковые: мел-спектрограмма [1, frames, 128] на 22 050 Гц
# (окно 1024, шаг 441, 128 мел-бин, 30…11 000 Гц, ln(1 + 1000·x)) и два логита — доля и сильная доля.
# Пакет режет трек на куски по 1500 кадров (30 с) с перекрытием 6 кадров; границы отбрасываются.
[io]
input = "spectrogram"
sample_rate = 22050
n_fft = 1024
hop = 441
mel_bins = 128
f_min = 30.0
f_max = 11000.0
log_multiplier = 1000.0
outputs = ["beat", "downbeat"]
frames_per_chunk = 1500
border_frames = 6
