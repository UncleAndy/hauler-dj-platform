[package]
name = "dj-controller-s4mk3"
description = "Traktor Kontrol S4 MK3: reports in, control events out; screens and LEDs out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
dj-controller-core = { path = "../dj-controller-core" }
# The screens are a USB bulk interface of their own, not HID: a pure-Rust USB stack keeps the controller free of a
# system libusb and works on the platforms the project ships for.
nusb = "0.2"

# `libwdi.dll` is loaded at run time, not linked: the Windows driver installer is optional, and a copy of the program
# without it must still start and say what the screens need (owner's decision, 2026-11-28).
[target.'cfg(windows)'.dependencies]
libloading = "0.8"

[dev-dependencies]
dj-domain = { path = "../dj-domain" }

[lints]
workspace = true
