[package]
name = "dj-library"
description = "SQLite collection, migrations and queries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# The index is a cache over portable metadata (DJP-DATA-006): SQLite for queries, bundled so the
# build does not depend on a system libsqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }
# Writing tags back into the copy that lands in the collection (MIT, DJP-LIC-001).
lofty.workspace = true
# The import reads tags in production code, not only in the probe.
symphonia = { version = "0.6", default-features = false, features = [
    "wav",
    "flac",
    "mp3",
    "ogg",
    "vorbis",
    "pcm",
    # Tags live in the container, not in the audio: without these the MP3 reader does not skip the
    # ID3v2 block at all and starts scanning inside it, where the UTF-16 BOM of the first text frame
    # (`FF FE`) reads as an MPEG Layer I header. One missing feature cost 37 files out of 114.
    "id3v2",
    "id3v1",
    "ape",
] }

[dev-dependencies]
# The probe decodes and fingerprints; the import itself does not (yet).
dj-codec = { path = "../dj-codec" }
dj-fingerprint = { path = "../dj-fingerprint" }

[lints]
workspace = true
