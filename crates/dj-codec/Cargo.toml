[package]
name = "dj-codec"
description = "Media probing, streaming decode, indexed seek and bounded PCM prefetch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# MPL-2.0, file-level copyleft: compatible as a dependency (see THIRD_PARTY.md).
# The mp3 feature is not on by default upstream; enabling it is a deliberate decision (ADR-0008).
symphonia = { version = "0.6", default-features = false, features = [
    "wav",
    "flac",
    "mp3",
    "ogg",
    "vorbis",
    "pcm",
    # Tags live in the container, not in the audio: without these the MP3 reader does not skip the
    # ID3v2 block at all and starts scanning inside it, where the UTF-16 BOM of the first text frame
    # (`FF FE`) reads as an MPEG Layer I header. One missing feature cost 37 files out of 114.
    "id3v2",
    "id3v1",
    "ape",
] }

[lints]
workspace = true
