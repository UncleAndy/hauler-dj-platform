[package]
name = "dj-bridge"
description = "Command and state transport between the engine process and its clients (ADR-0003)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
dj-domain = { path = "../dj-domain" }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
# The pipe functions live in System::Pipes and their signatures name OVERLAPPED and SECURITY_ATTRIBUTES:
# windows-sys cfg's each item out unless those modules are enabled too.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }
