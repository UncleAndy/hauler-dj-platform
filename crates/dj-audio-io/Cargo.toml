[package]
name = "dj-audio-io"
description = "Device output over CPAL: route plans, bounded callback, xrun and timing counters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Same backend decision as ADR-0002: CPAL with the native PipeWire host on Linux, WASAPI/CoreAudio
# elsewhere.



[lints]
workspace = true

# The Linux backend is PipeWire; Windows and macOS use what cpal gives them by default (WASAPI, CoreAudio).
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pipewire"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
