[package]
name = "dj-deck"
description = "Deck state machine: transport, loop and hotcues over a decoded source."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
dj-codec = { path = "../dj-codec" }
dj-domain = { path = "../dj-domain" }
# The channel's three-band EQ sits on the deck: a deck reaches the mixer already gain-staged and
# equalised, which is the order the mixer's own contract names (DJP-ARCH-006).
dj-dsp = { path = "../dj-dsp" }
# Key lock: the tempo moves and the pitch does not (DJP-DECK-008). The vendored library does the
# stretching; this crate only decides when and at which rate.
dj-stretch-sys = { path = "../dj-stretch-sys" }
# Meter ballistics: the channel strip's bar rises to the peak and falls back at a steady rate.
dj-signalsmith-sys = { path = "../dj-signalsmith-sys" }

[lints]
workspace = true
