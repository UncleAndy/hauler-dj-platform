[workspace]
resolver = "3"
members = ["crates/*", "apps/dj-headless", "apps/dj-cli", "apps/dj-audio-probe", "apps/dj-media-bench", "apps/dj-live-probe", "apps/dj-engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Andrey Velikoredchanin"]

# Workspace lints. The audio real-time contract (DJP-NFR-001, docs/architecture/rt-contract.md)
# makes unwrap/expect/panic in library code a defect; crates additionally set
# `#![cfg_attr(not(test), deny(clippy::unwrap_used))]` so tests stay writable.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "deny"

# Shared dependency versions. serde is already in the tree through the probe; it is
# declared here so the domain contracts are versioned in one place.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Human-edited settings files: TOML keeps them readable and still typed.
toml = "0.9"
